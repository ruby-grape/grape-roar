---
name: test-mongodb
on: workflow_call
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.entry.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.3', mongoid: '~> 6.4.8', mongodb: '6.0', grape: '~> 1.7.0', rack: '~> 2.2', coverage: false }
          - { ruby: '3.3', mongoid: '~> 6.4.8', mongodb: '6.0', grape: '~> 2.0.0', coverage: true }
          - { ruby: '3.3', mongoid: '~> 7.5.4', mongodb: '7.0', grape: '~> 2.4', coverage: false }
          - { ruby: '3.3', mongoid: '~> 8.1.11', mongodb: '8.0', grape: '~> 2.4', coverage: false, os: 'ubuntu-22.04' }
          - { ruby: '3.3', mongoid: '~> 8.1.11', mongodb: '8.0', grape: '~> 3.0', coverage: false, os: 'ubuntu-22.04' }
          - { ruby: '3.4', mongoid: '~> 9.1', mongodb: '8.0', grape: '~> 4.0', coverage: true, os: 'ubuntu-22.04' }
          - { ruby: '4.0', mongoid: '~> 9.1', mongodb: '8.0', grape: '~> 4.0', coverage: false, os: 'ubuntu-22.04' }
    name: test (ruby=${{ matrix.entry.ruby }}, mongoid=${{ matrix.entry.mongoid }}, mongodb=${{ matrix.entry.mongodb }}, grape=${{ matrix.entry.grape }})
    env:
      MONGOID_VERSION: ${{ matrix.entry.mongoid }}
      GRAPE_VERSION: ${{ matrix.entry.grape }}
      RACK_VERSION: ${{ matrix.entry.rack || '>= 0' }}
    services:
      mongodb:
        image: mongo:${{ matrix.entry.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
      - uses: coverallsapp/github-action@v2
        if: matrix.entry.coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov/grape-roar.lcov
          format: lcov
          flag-name: mongoid-${{ strategy.job-index }}
          parallel: true
