---
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.entry.os || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.entry.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '2.7', grape: '~> 1.8', rack: '~> 2.2', os: 'ubuntu-22.04' }
          - { ruby: '2.7', grape: '~> 2.4', os: 'ubuntu-22.04' }
          - { ruby: '3.3', grape: '~> 1.8', rack: '~> 2.2' }
          - { ruby: '3.3', grape: '~> 2.4' }
          - { ruby: '3.3', grape: '~> 3.0' }
          - { ruby: '3.3', grape: '~> 4.0' }
          - { ruby: '3.4', grape: '~> 4.0' }
          - { ruby: '4.0', grape: '~> 4.0' }
          - { ruby: 'ruby-head', grape: '~> 4.0', experimental: true }
    name: test (ruby=${{ matrix.entry.ruby }}, grape=${{ matrix.entry.grape }})
    env:
      GRAPE_VERSION: ${{ matrix.entry.grape }}
      RACK_VERSION: ${{ matrix.entry.rack || '>= 0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
  test-activerecord:
    uses: ./.github/workflows/test-activerecord.yml
  test-mongodb:
    uses: ./.github/workflows/test-mongodb.yml
  finish:
    name: Finish Coveralls
    needs: [test, test-activerecord, test-mongodb]
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
